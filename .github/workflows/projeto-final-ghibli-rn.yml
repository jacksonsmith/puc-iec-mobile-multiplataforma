name: Projeto Final - Studio Ghibli RN

on:
  pull_request:
    paths:
      - 'exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/**'
      - '.github/workflows/projeto-final-ghibli-rn.yml'
  push:
    branches: ['entrega/projeto-final-*']
    paths:
      - 'exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/**'
      - '.github/workflows/projeto-final-ghibli-rn.yml'
  workflow_dispatch:

concurrency:
  group: projeto-final-ghibli-${{ github.ref }}
  cancel-in-progress: true

# O app fica nesta pasta do repositório da disciplina.
defaults:
  run:
    working-directory: exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/package-lock.json
      - run: npm ci
      # O expo-env.d.ts é gerado localmente pelo Expo e fica fora do Git.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e-android:
    name: Flows Maestro no Android
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      API_LEVEL: 34
      MAESTRO_VERSION: 2.12.1
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # As versões exigidas pelo React Native 0.88 não vêm instaladas no runner.
      - name: Instalar os componentes do Android SDK
        run: |
          sudo chown -R "$USER" "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null
      - run: npm ci
      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install
      # O services.gradle.org falha com frequência nos runners; o mirror oficial no GitHub não.
      - name: Baixar o Gradle
        working-directory: exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/android
        run: |
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=.*/gradle-([0-9.]+)-bin.zip#distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            sleep 20
          done
          exit 1
      - name: Compilar o APK de release
        working-directory: exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/android
        # Em caso de falha, publica o motivo como anotação, visível sem abrir o log inteiro.
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 2>&1 | tee build.log || {
            reason=$(grep -A 12 "What went wrong" build.log | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha no Gradle::$reason"
            exit 1
          }
      - name: Instalar o Maestro
        run: |
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # O instalador pode falhar sem erro; só o binário funcionando confirma a instalação.
          for attempt in 1 2 3 4 5; do
            curl -fsSL "https://get.maestro.mobile.dev" | bash
            "$HOME/.maestro/bin/maestro" --version && exit 0
            sleep 20
          done
          exit 1
      - name: Habilitar a aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar os flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          # Sem perfil, o emulador usa uma tela bem menor que a de um celular atual.
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e/maestro/ --format junit --output maestro-report.xml --debug-output maestro-debug
      - name: Guardar os resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/maestro-report.xml
            exercicios/projeto-final/skeletons/studio-ghibli/react-native/pratica/maestro-debug
          if-no-files-found: ignore
          # O Maestro guarda as capturas de tela em uma pasta oculta (.maestro).
          include-hidden-files: true
      - name: Publicar as falhas dos flows
        if: failure()
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/maestro-annotations.py"
