name: Testes Atividade 2 Amanda
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exercicios/02-app-rn-navegacao-estado/amanda-santos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: exercicios/02-app-rn-navegacao-estado/amanda-santos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
