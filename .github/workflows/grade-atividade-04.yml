name: A4 — PWA (autograder)

# Segurança: pull_request_target tem permissão de comentar. Por isso este job NUNCA executa
# código da entrega (nada de npm ci / npm test / build do aluno) — o validator do professor
# (checkout da main) apenas LÊ os arquivos da entrega.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'exercicios/04-pwa-tmdb/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  grade:
    name: Grade A4
    runs-on: ubuntu-latest
    steps:
      # 1. checkout BASE (grader confiável do prof)
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # 2. checkout do PR do aluno em pasta isolada (não-confiável — só leitura)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
          path: _pr

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. validator estrutural (código do prof, lê a entrega em _pr/)
      - name: Structural validator
        working-directory: exercicios/04-pwa-tmdb/grader
        run: |
          npm ci
          npx ts-node validator.ts --entrega ../../../_pr/exercicios/04-pwa-tmdb/pratica
        continue-on-error: true

      # 4. comentar a nota mínima no PR
      - name: Post grade comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let lines = '⚠️ O avaliador não conseguiu rodar — **pode ser falha do avaliador, não da sua entrega**. Avise o professor no PR.';
            let scoreLine = '';
            try {
              const g = JSON.parse(fs.readFileSync('exercicios/04-pwa-tmdb/grader/grade.json', 'utf8'));
              lines = g.results.map(r => r.manual
                ? `📝 **${r.label}** (/${r.weight}): avaliação manual (Canvas)`
                : `${r.pass ? '✅' : '❌'} **${r.label}** (${r.pass ? r.weight : 0}/${r.weight}): ${r.note}`
              ).join('\n');
              scoreLine = `\n**Nota mínima automática: ${g.autoScore}/${g.autoMax}** (o lab vale ${g.maxScore}; o restante é avaliação manual no Canvas)\n`;
            } catch (e) {}

            const body = [
              '## 🤖 A4 — PWA Autograder',
              '',
              '**Checklist estrutural (leitura dos seus arquivos — nada da sua entrega é executado):**',
              '',
              lines,
              scoreLine,
              '🧪 Rode `npm test`, `npm run build` e `npm run preview` na sua máquina — o bot não roda o seu código.',
              '📝 Evidências, reflexão e qualidade do código entram na nota final lançada no Canvas.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # 5. artifact privado (só o prof vê)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade-results
          path: exercicios/04-pwa-tmdb/grader/grade.json
